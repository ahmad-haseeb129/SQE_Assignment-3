[pytest]
testpaths = assignment_tests tests
pythonpath = .
markers =
    parser: Tests for dateutil.parser module
    relativedelta: Tests for dateutil.relativedelta module
    rrule: Tests for dateutil.rrule module
    ecp: Equivalence Class Partitioning tests
    bva: Boundary Value Analysis tests
    boundary: Boundary Value Analysis tests
    data_driven: Tests driven by external CSV data
    csv_driven: Tests driven by external CSV data
    smoke: Quick smoke tests
    slow: Slower tests
    order: Test execution order

# Default options: verbose output, show short test summary
addopts = -v --tb=short
